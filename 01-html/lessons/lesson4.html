<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Group Invite</title>
</head>
<body>
    <h1>Join My Study Group</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
        <br><br>
        <label for="email">Enter your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email" required>
         <br><br>
        <label for="yearofstudy" >Year Of Study</label>
        <select id="yearofstudy" name="yearofstudy" required>
            <option value="">Select the year</option>
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
        </select>
         <br><br>
        <label for="studyhours" >Number of Study Hours per week</label>
        <input id="studyhours" type="number" name="studyhours" min="1" required>
         <br><br>
        <button type="submit">Join the group</button>
    
    </form>
</body>
</html>
